<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magooify</title>
    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar border-bottom mb-3">
      <div class="container">
        <span class="navbar-brand">
          <span class="brand-icon">M</span>
          Magooify
        </span>
        <span class="badge rounded-pill text-bg-success" id="conn-badge">connected</span>
      </div>
    </nav>

    <main class="container" style="max-width: 640px">
      <div class="card mb-3">
        <div class="card-body">
          <button type="button" id="btn-camera" class="btn btn-primary btn-lg w-100 mb-2" data-bs-toggle="modal" data-bs-target="#cameraModal">Take Photo</button>
          <button type="button" id="btn-upload" class="btn btn-outline-light btn-lg w-100">Upload Image</button>
          <input type="file" id="file-input" accept="image/*" hidden />
        </div>
      </div>

      <div class="card mb-3">
        <div class="card-body">
          <div id="drop-zone" class="drop-zone">
            <div id="preview-wrap" class="preview-wrap d-none">
              <img id="preview" alt="Selected image" class="preview-img" />
            </div>
            <div id="no-image" class="text-center text-secondary py-4">
              <div class="fs-5">Drop file here</div>
              <div class="small mt-1">or click to browse</div>
            </div>
          </div>
          <button type="button" id="btn-process" class="btn btn-success btn-lg w-100 mt-3" disabled>Process</button>
          <div id="process-status" class="small mt-2 text-secondary text-center">&nbsp;</div>
        </div>
      </div>

      <div id="result-card" class="card mb-3 d-none">
        <div class="card-header">Processed Image</div>
        <div class="card-body">
          <img id="result-image" alt="Processed image" class="result-img" />
          <div class="small text-secondary mt-2">
            <div class="font-monospace" id="result-filename"></div>
            <div><span id="result-model"></span> &middot; <span id="result-time"></span></div>
          </div>
        </div>
      </div>
    </main>

    <div class="modal fade" id="cameraModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Take a Photo</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <video id="camera-video" autoplay playsinline muted class="camera-video"></video>
            <div id="camera-error" class="alert alert-warning d-none mb-0"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" id="btn-capture" class="btn btn-primary" disabled>Capture</button>
          </div>
        </div>
      </div>
    </div>

    <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
